<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NYRA VTuber - OBS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* La página ocupa todo el Browser Source: el tamaño se elige en OBS (recomendado 1024x1536) */
  html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; }

  .scene { width:100%; height:100%; position:relative; display:flex; align-items:flex-end; justify-content:center; }

  /* Caja 2:3 exacta (1024x1536) alineada abajo al centro: sprite base y capas de cara calzan píxel por píxel */
  .avatar {
    position: relative;
    width: min(100vw, calc(100vh * 1024 / 1536));
    height: min(100vh, calc(100vw * 1536 / 1024));
    transform-origin: bottom center;
  }
  #sprite, .face-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom center;
    image-rendering: pixelated;
    pointer-events: none;
  }
  #face-layers { position: absolute; inset: 0; pointer-events: none; }
  .face-layer.is-hidden { display: none; }
  /* Cubre solo los 27x9 px de 23_boca_closed en neutral para que no asomen comisuras en visemas angostos ('a', 'o', 'u') */
  .mouth-skin-patch { clip-path: inset(15.8203% 51.9531% 83.5938% 45.4102%); }
  body.layers-fallback #face-layers { display: none; }

  /* Animaciones por estado — se aplican al wrapper */
  .avatar.idle     { animation: breathe 4s ease-in-out infinite; }
  .avatar.speaking { animation: speak-bob .3s ease-in-out infinite alternate; }
  .avatar.thinking { animation: think-sway 1.5s ease-in-out infinite; }

  /* Check "Efecto de flotar" apagado en el panel: avatar quieto */
  body.no-float .avatar { animation: none !important; }

  /* Avatar 3D (VRoid): se elige en el panel o con ?3d en la URL */
  #stage3d { display:none; position:absolute; inset:0; }
  #stage3d canvas { width:100%; height:100%; display:block; }
  body.mode3d #stage3d { display:block; }
  body.mode3d #avatar { display:none; }

  @keyframes breathe { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1%)} }
  @keyframes speak-bob { from{transform:translateY(0) rotate(-.25deg)} to{transform:translateY(-.7%) rotate(.25deg)} }
  @keyframes think-sway{ 0%,100%{transform:rotate(-1deg)} 50%{transform:rotate(1deg) translateY(-.8%)} }

  /* ── Wave ── */
  .wave { position:absolute; bottom:14px; right:14px; display:none; align-items:center; gap:3px; background:rgba(8,4,20,.85); border:1px solid rgba(190,120,255,.22); border-radius:24px; padding:7px 14px; z-index:3; }
  .wave.show { display:flex; }
  .wave span { width:3px; background:#bb77ff; border-radius:3px; animation:wv .75s ease-in-out infinite; }
  .wave span:nth-child(1){height:5px} .wave span:nth-child(2){height:12px;animation-delay:.1s}
  .wave span:nth-child(3){height:7px;animation-delay:.2s} .wave span:nth-child(4){height:15px;animation-delay:.14s} .wave span:nth-child(5){height:5px;animation-delay:.06s}
  @keyframes wv { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.18)} }
</style>
</head>
<body>
<div class="scene">
  <div class="wave" id="wave">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="avatar idle" id="avatar">
    <img id="sprite" src="avatar/cecilia_neutral_eye-open_mouth-closed.png" alt="NYRA">
    <div id="face-layers"></div>
  </div>
  <div id="stage3d"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "@pixiv/three-vrm": "/vendor/three-vrm/three-vrm.module.min.js",
  "@pixiv/three-vrm-animation": "/vendor/three-vrm-animation/three-vrm-animation.module.min.js"
} }
</script>

<!-- Overlay para desbloquear autoplay en browsers con restricción -->
<div id="audio-overlay" style="
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.45); cursor:pointer;
" onclick="this.style.display='none'; if(typeof _actx!=='undefined'&&_actx&&_actx.state==='suspended')_actx.resume();">
  <div style="color:#00f5ff;font-family:monospace;font-size:13px;text-align:center;text-shadow:0 0 10px #00f5ff;">
    🔊 CLICK PARA ACTIVAR AUDIO
  </div>
</div>

<script type="module">
  import { getMoodState, resolveSpeakingEmotion } from './emotion-config.js';

  const overlay    = document.getElementById('audio-overlay');
  const avatar     = document.getElementById('avatar');
  const wave       = document.getElementById('wave');
  const sprite     = document.getElementById('sprite');
  const faceLayers = document.getElementById('face-layers');

  // ── Sprite entero de base + capas de cara (párpados, ojos de emoción y bocas) ──
  const VISEMES   = ['closed', 'mbp', 'a', 'ei', 'o', 'u', 'fv', 'l'];
  const EMOTIONS  = ['happy', 'sad', 'angry', 'surprised'];
  const ALL_EMOS  = ['neutral', ...EMOTIONS, 'thinking'];
  const LAYER_DIR = 'avatar/cecilia_layers_v2';
  const file = (emo, eye, mouth) => `avatar/cecilia_${emo}_eye-${eye}_mouth-${mouth}.png`;

  // Precargar los 6 sprites base con boca cerrada
  for (const emo of ALL_EMOS) { const i = new Image(); i.src = file(emo, 'open', 'closed'); }

  const EMO_EYES = {
    happy: '36_ojos_happy',
    angry: '37_ojos_angry',
    sad: '38_ojos_sad',
    surprised: '39_ojos_surprised',
    thinking: '40_ojos_thinking',
  };
  const NEUTRAL_MOUTHS = {
    closed: '23_boca_closed',
    a: '24_boca_a',
    ei: '25_boca_ei',
    o: '26_boca_o',
    u: '27_boca_u',
    fv: '28_boca_fv',
    l: '29_boca_l',
    mbp: '30_boca_mbp',
  };
  const EMO_MOUTHS_CLOSED = {
    happy: '41_boca_happy',
    angry: '42_boca_angry',
    sad: '43_boca_sad',
    surprised: '44_boca_surprised',
    thinking: '45_boca_thinking',
  };
  const EMO_MOUTHS_OPEN = {
    happy: '46_boca_happy_open',
    angry: '47_boca_angry_open',
    sad: '48_boca_sad_open',
    surprised: '49_boca_surprised_open',
  };
  const ALL_MOUTHS = [
    ...Object.values(NEUTRAL_MOUTHS),
    ...Object.values(EMO_MOUTHS_CLOSED),
    ...Object.values(EMO_MOUTHS_OPEN),
  ];

  let useFallback = false;
  let fallbackPreloaded = false;
  const layerEls = {};
  const face = { emo: 'neutral', eye: 'open', mouth: 'closed' };

  function activateFallback(failedLayer) {
    if (useFallback) return;
    useFallback = true;
    console.warn('Capa de cara no cargó, quedando con el sprite entero:', failedLayer);
    document.body.classList.add('layers-fallback');
    if (face.emo === 'thinking') blinkEnabled = false;
    if (face.emo !== 'neutral' && face.eye !== 'open') face.eye = 'open';
    if (!fallbackPreloaded) {
      fallbackPreloaded = true;
      const preload = [];
      for (const eye of ['open', 'half', 'closed']) for (const v of VISEMES) preload.push(file('neutral', eye, v));
      for (const emo of EMOTIONS) for (const m of ['closed', 'open']) preload.push(file(emo, 'open', m));
      preload.push(file('thinking', 'open', 'closed'));
      preload.forEach(src => { const i = new Image(); i.src = src; });
    }
    render();
  }

  function addFaceLayer(key, fileStem, extraClass = '') {
    const img = document.createElement('img');
    img.className = 'face-layer is-hidden' + (extraClass ? ' ' + extraClass : '');
    img.alt = '';
    img.decoding = 'sync';
    img.dataset.layer = key;
    img.onerror = () => activateFallback(fileStem);
    img.onload = () => { if (img.decode) img.decode().catch(() => {}); };
    img.src = `${LAYER_DIR}/${fileStem}.png`;
    faceLayers.appendChild(img);
    layerEls[key] = img;
    return img;
  }

  // Solo capas de cara encima del sprite: ojos de emoción (debajo del párpado), párpados y bocas
  for (const n of Object.values(EMO_EYES)) addFaceLayer(n, n);
  for (const n of ['13_parpado_medio_izq', '14_parpado_medio_der', '15_parpado_cerrado_izq', '16_parpado_cerrado_der']) {
    addFaceLayer(n, n);
  }
  addFaceLayer('mouth_skin_patch', '07_cara_base', 'mouth-skin-patch');
  for (const n of ALL_MOUTHS) addFaceLayer(n, n);

  function showLayer(key, on) {
    layerEls[key].classList.toggle('is-hidden', !on);
  }

  function render() {
    if (useFallback) {
      const src = face.emo === 'neutral'  ? file('neutral', face.eye, face.mouth)
                : face.emo === 'thinking' ? file('thinking', 'open', 'closed') // solo existe con boca cerrada
                : file(face.emo, 'open', (face.mouth === 'closed' || face.mouth === 'mbp') ? 'closed' : 'open');
      if (!sprite.src.endsWith(src)) sprite.src = src;
      return;
    }

    const emo = ALL_EMOS.includes(face.emo) ? face.emo : 'neutral';
    const isNeutral = emo === 'neutral';
    const baseSrc = file(emo, 'open', 'closed');
    if (!sprite.src.endsWith(baseSrc)) sprite.src = baseSrc;

    const half = face.eye === 'half', closed = face.eye === 'closed';
    const blinking = half || closed;

    // Ojos de la emoción debajo del párpado cuando parpadea fuera de neutral
    for (const [e, n] of Object.entries(EMO_EYES)) showLayer(n, blinking && emo === e);

    // Párpados encima en todas las emociones
    showLayer('13_parpado_medio_izq', half);
    showLayer('14_parpado_medio_der', half);
    showLayer('15_parpado_cerrado_izq', closed);
    showLayer('16_parpado_cerrado_der', closed);

    // Boca encima del sprite con boca cerrada
    const activeMouth = isNeutral
      ? (NEUTRAL_MOUTHS[face.mouth] || '23_boca_closed')
      : emo === 'thinking'
        ? '45_boca_thinking'
        : (face.mouth === 'closed' || face.mouth === 'mbp')
          ? EMO_MOUTHS_CLOSED[emo]
          : EMO_MOUTHS_OPEN[emo];
    showLayer('mouth_skin_patch', isNeutral && activeMouth !== '23_boca_closed');
    for (const n of ALL_MOUTHS) showLayer(n, n === activeMouth);
  }
  function setFace(changes) { Object.assign(face, changes); render(); }

  // ── Emoción según el tono de la respuesta (fuente centralizada en emotion-config.js) ──
  function detectEmotion(text, explicitEmotion = null, turnMood = mood) {
    return resolveSpeakingEmotion({ explicitEmotion, text, mood: turnMood });
  }

  // ── Parpadeo: open → half → closed → half → open (en todas las emociones; en fallback solo neutral) ──
  let blinkTimer = null, blinkEnabled = true;
  function scheduleBlink() {
    clearTimeout(blinkTimer);
    blinkTimer = setTimeout(() => {
      if (blinkEnabled && face.eye === 'open' && (!useFallback || face.emo === 'neutral')) {
        // Tiempos del test de parpadeo (cecilia_blink_test.gif): medio 70ms, cerrado 110ms, medio 70ms
        const steps = [['half', 0], ['closed', 70], ['half', 180], ['open', 250]];
        steps.forEach(([eye, at]) => setTimeout(() => { if (blinkEnabled && (!useFallback || face.emo === 'neutral')) setFace({ eye }); }, at));
        setTimeout(() => setFace({ eye: 'open' }), 260); // por si algo cambió a mitad
      }
      scheduleBlink();
    }, 2800 + Math.random() * 3200);
  }

  // ── Lip-sync: recorre el texto repartido en la duración del audio ──
  function charToViseme(ch, prev) {
    const c = ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if ('a'.includes(c)) return 'a';
    if ('ei'.includes(c)) return 'ei';
    if ('o'.includes(c)) return 'o';
    if ('uw'.includes(c)) return 'u';
    if ('mbp'.includes(c)) return 'mbp';
    if ('fv'.includes(c)) return 'fv';
    if ('l'.includes(c)) return 'l';
    if (/[a-zñ]/.test(c)) return prev === 'closed' ? 'ei' : prev; // otras consonantes: mantener la forma
    return 'closed';                                               // espacios y puntuación
  }
  let lipTimer = null;
  function startLipsync(text, durationMs) {
    stopLipsync();
    const chars = [...text];
    if (!chars.length) return;
    const dur = durationMs > 0 ? durationMs : chars.length * 70;
    const t0 = performance.now();
    let prev = 'closed';
    lipTimer = setInterval(() => {
      const idx = Math.floor((performance.now() - t0) / dur * chars.length);
      if (idx >= chars.length) return stopLipsync();
      prev = charToViseme(chars[idx], prev);
      setFace({ mouth: prev });
    }, 60);
  }
  function stopLipsync() { clearInterval(lipTimer); lipTimer = null; setFace({ mouth: 'closed' }); }

  // ── Estado general ──
  function setState(s) {
    avatar.className = 'avatar ' + s;
    wave.classList.toggle('show', s === 'speaking');
    if (s === 'thinking') {
      stopLipsync();
      blinkEnabled = !useFallback;
      setFace({ emo: 'thinking', eye: 'open', mouth: 'closed' });
    } else if (s === 'speaking') {
      blinkEnabled = true;
      setFace({ eye: 'open' });
    } else { // idle: la cara en reposo refleja el humor del live
      stopLipsync();
      blinkEnabled = true;
      setFace({ emo: idleEmotion(), eye: 'open', mouth: 'closed' });
    }
  }
  // ── Avatar 3D: el módulo lee la misma cara y estado que el 2D; si no carga, queda el 2D ──
  const FORCE_3D = new URLSearchParams(location.search).has('3d');
  let loading3d = null, nyra3d = null, pendingGesture = null, obs3dActive = FORCE_3D, failed3d = false;
  const notify3d = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'obs_3d', on: obs3dActive })); };
  function set3d(on) {
    document.body.classList.toggle('mode3d', on);
    if (!on || loading3d) return;
    loading3d = import('./avatar3d/vrm.js')
      .then(m => m.start(document.getElementById('stage3d'), 'avatar3d/NYRA.vrm', face, () => avatar.className))
      .then(ctl => { nyra3d = ctl; })
      .catch(err => { console.warn('El avatar 3D no cargó, sigo en 2D:', err); document.body.classList.remove('mode3d'); loading3d = null; failed3d = true; if (FORCE_3D) { obs3dActive = false; notify3d(); } });
  }
  if (FORCE_3D) set3d(true);

  let mood = 50;
  const idleEmotion = () => getMoodState(mood).baseEmotion;

  // ── WebSocket ──
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let ws;
  let lastText = '';
  let idleTimer = null;

  function onWsMessage({ data }) {
    const m = JSON.parse(data);

    if (m.type === 'welcome') {
      setTimeout(() => setFace({ emo: 'surprised' }), 900);
      setTimeout(() => setFace({ emo: 'neutral' }), 2000);
    }
    if (m.type === 'thinking') setState(m.thinking ? 'thinking' : 'idle');
    if (m.type === 'stream_alert') setFace({ emo: (m.tier === 'big' || m.tier === 'epic') ? 'surprised' : 'happy' });
    if (m.type === 'live_state') {
      mood = m.mood;
      document.body.classList.toggle('no-float', m.float === false);
      set3d(FORCE_3D || m.avatar3d === true);
      // Fondo elegido en el panel ("none" = transparente, para usar el fondo de OBS/TikTok Studio)
      document.body.style.background = m.background && m.background !== 'none'
        ? `#000 url(backgrounds/${m.background}.png) center / cover no-repeat` : 'transparent';
      if (avatar.classList.contains('idle')) setFace({ emo: idleEmotion() });
    }
    if (m.type === 'stream_end') {
      lastText = m.fullText || '';
      pendingGesture = m.gesture || null; // arranca con el audio
      setState('speaking');
      // Prioridad: 1) emoción situacional explícita, 2) emoción contextual del texto, 3) humor base del turno
      const turnMood = Number.isFinite(Number(m.mood)) ? m.mood : mood;
      setFace({ emo: detectEmotion(lastText, m.emotion, turnMood), mouth: 'closed' });
      // Si no llega audio (TTS caído), volver a idle solo
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => { if (!_audioPlaying) setState('idle'); }, 8000);
    }
    if (m.type === 'tts_play') playTTS(m.url, m.mute);
    if (m.type === 'error') setState('idle');
  };

  // Reconectar si se reinicia el server (si no, la fuente de OBS/TikTok Studio queda "muda" hasta recargarla)
  function connectWS() {
    ws = new WebSocket(`${wsProto}//${location.host}${obs3dActive ? '?3d=1' : ''}`);
    ws.onopen = () => { if (FORCE_3D) notify3d(); };
    ws.onmessage = onWsMessage;
    ws.onclose = () => setTimeout(connectWS, 2000);
  }
  connectWS();

  // Llamados por el reproductor cuando el audio empieza/termina de sonar
  function onAudioStart(durationSec) {
    clearTimeout(idleTimer);
    setState('speaking');
    startLipsync(lastText, durationSec * 1000);
    if (pendingGesture && document.body.classList.contains('mode3d')) nyra3d?.gesture(pendingGesture);
    pendingGesture = null;
  }
  function onAudioEnd() {
    stopLipsync();
    setTimeout(() => { if (!_audioPlaying) setState('idle'); }, 600);
  }


  // ── AudioContext (evita bloqueo autoplay en browsers normales) ──
  let _actx = null;

  // Detectar si estamos dentro de OBS Browser Source
  // Fuentes embebidas donde no se puede hacer clic (OBS, TikTok LIVE Studio con /obs?autoplay):
  // sin cartel de "click para activar audio" y reproducción directa con <audio>
  // ?mute: solo imagen (el audio sale por otra fuente). Reproduce silenciado para que el lip-sync y tts_done sigan andando
  const _MUTE = new URLSearchParams(location.search).has('mute');
  // ?3d también: es la fuente del avatar 3D en OBS/TikTok LIVE Studio, donde no se puede hacer clic
  const _qs = new URLSearchParams(location.search);
  const _isOBS = typeof window.obsstudio !== 'undefined' || _MUTE || _qs.has('autoplay') || _qs.has('3d');

  function _getCtx() {
    if (!_actx) _actx = window._actx = new (window.AudioContext || window.webkitAudioContext)();
    return _actx;
  }

  function _unlock() {
    const ctx = _getCtx();
    ctx.resume().catch(() => {});
    overlay.style.display = 'none';
  }

  if (_isOBS) {
    // ── Dentro de OBS: audio sin restricciones ──
    overlay.style.display = 'none'; // ocultar overlay, no hace falta click
    // Intentar desbloquear AudioContext apenas carga
    setTimeout(_unlock, 300);
    // OBS dispara estos eventos al activar/desactivar la fuente o cambiar escena
    window.addEventListener('obsSceneActiveChanged',  (e) => { if (e.detail?.active)  _unlock(); });
    window.addEventListener('obsSourceActiveChanged', (e) => { if (e.detail?.active)  _unlock(); });
    window.addEventListener('obsSourceVisibleChanged',(e) => { if (e.detail?.visible) _unlock(); if (FORCE_3D && typeof e.detail?.visible === 'boolean') { obs3dActive = e.detail.visible && !failed3d; notify3d(); } });
  } else {
    // ── Browser normal: requiere interacción del usuario ──
    document.addEventListener('click',   _unlock, { once: false });
    document.addEventListener('keydown', _unlock, { once: false });
  }

  // Cola de audio: garantiza que nunca se superpongan dos audios
  const _audioQueue = [];
  let   _audioPlaying = false;

  function _sendTTSDone() {
    if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'tts_done', url: _currentUrl }));
    _audioPlaying = false;
    onAudioEnd();
    if (_audioQueue.length > 0) _playNext(..._audioQueue.shift());
  }

  function playTTS(url, mute) {
    if (_audioPlaying) {
      _audioQueue.push([url, mute]);  // encolar: espera a que termine el audio actual
    } else {
      _playNext(url, mute);
    }
  }

  // <audio> simple (OBS y fallback): arranca el lip-sync cuando suena de verdad
  function _playElement(url, mute) {
    const a = new Audio(url);
    a.muted = _MUTE;
    if (mute) a.volume = 0; // ya suena por Discord, acá solo mueve la boca (con muted, Chromium lo pausa en segundo plano)
    a.onplaying = () => onAudioStart(a.duration);
    a.onended = _sendTTSDone;
    a.onerror = _sendTTSDone;
    return a.play();
  }

  let _currentUrl = null; // el server ignora avisos de audios que ya no son el actual
  async function _playNext(url, mute) {
    _audioPlaying = true;
    _currentUrl = url;
    try {
      if (_isOBS) {
        // OBS: autoplay sin restricciones — onended envía tts_done
        await _playElement(url, mute);
        return;  // _sendTTSDone se llama vía onended, no aquí
      }
      // Browser normal: AudioContext para evitar bloqueo de autoplay
      const ctx = _getCtx();
      if (ctx.state === 'suspended') await ctx.resume();
      const res     = await fetch(url);
      const buf     = await res.arrayBuffer();
      const decoded = await ctx.decodeAudioData(buf);
      const src     = ctx.createBufferSource();
      src.buffer    = decoded;
      if (!mute) src.connect(ctx.destination);
      src.onended = _sendTTSDone;
      src.start(0);
      onAudioStart(decoded.duration);
    } catch(e) {
      console.warn('TTS audio error:', e);
      _playElement(url, mute).catch(_sendTTSDone);
    }
  }

  // ── Arrancar ──
  setState('idle');
  scheduleBlink();
</script>
</body>
</html>
